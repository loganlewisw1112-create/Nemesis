name: NEMESIS CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

jobs:
  verify-package:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force ci-artifacts | Out-Null
          npm ci --foreground-scripts --no-audit --fund=false 2>&1 | Tee-Object -FilePath ci-artifacts/install.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build
        shell: pwsh
        run: |
          npm run ci:build 2>&1 | Tee-Object -FilePath ci-artifacts/build.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Typecheck
        shell: pwsh
        run: |
          npm run ci:typecheck 2>&1 | Tee-Object -FilePath ci-artifacts/typecheck.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Unit tests
        shell: pwsh
        run: |
          npm run ci:unit 2>&1 | Tee-Object -FilePath ci-artifacts/unit.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: E2E tests
        shell: pwsh
        run: |
          npm run ci:e2e 2>&1 | Tee-Object -FilePath ci-artifacts/e2e.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package Windows apps
        shell: pwsh
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          npm run ci:package 2>&1 | Tee-Object -FilePath ci-artifacts/package.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify Windows signatures
        shell: pwsh
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
        run: |
          $files = @(
            "apps/desktop/release/NEMESIS Setup 0.1.0.exe",
            "apps/desktop/release/win-unpacked/NEMESIS.exe",
            "apps/desktop/release/win-unpacked/resources/gea-app/Global Event Alpha.exe"
          )
          if (-not $env:CSC_LINK) {
            "CSC_LINK not configured; package artifacts are unsigned in this run." | Tee-Object -FilePath ci-artifacts/signatures.log
            exit 0
          }
          foreach ($file in $files) {
            $sig = Get-AuthenticodeSignature $file
            "$file`t$($sig.Status)`t$($sig.SignerCertificate.Subject)" | Tee-Object -FilePath ci-artifacts/signatures.log -Append
            if ($sig.Status -ne "Valid") { exit 1 }
          }

      - name: Upload CI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nemesis-ci-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            ci-artifacts/**
            apps/desktop/release/**
            apps/global-event-alpha/release/**
            apps/desktop/test-results/**
            apps/desktop/playwright-report/**
