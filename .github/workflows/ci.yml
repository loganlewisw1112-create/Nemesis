name: NEMESIS CI

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  verify-package:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force ci-artifacts | Out-Null
          npm ci --foreground-scripts --no-audit --fund=false 2>&1 | Tee-Object -FilePath ci-artifacts/install.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build
        shell: pwsh
        run: |
          npm run ci:build 2>&1 | Tee-Object -FilePath ci-artifacts/build.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Typecheck
        shell: pwsh
        run: |
          npm run ci:typecheck 2>&1 | Tee-Object -FilePath ci-artifacts/typecheck.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Unit tests
        shell: pwsh
        run: |
          npm run ci:unit 2>&1 | Tee-Object -FilePath ci-artifacts/unit.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: E2E tests
        shell: pwsh
        run: |
          npm run ci:e2e 2>&1 | Tee-Object -FilePath ci-artifacts/e2e.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package Windows apps
        shell: pwsh
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          $isRelease = "${{ startsWith(github.ref, 'refs/tags/') }}"
          if ($isRelease -eq "true" -and (-not $env:CSC_LINK -or -not $env:CSC_KEY_PASSWORD)) {
            throw "Release/tag builds require CSC_LINK and CSC_KEY_PASSWORD signing secrets."
          }
          if (-not $env:CSC_LINK -or -not $env:CSC_KEY_PASSWORD) {
            "UNSIGNED CI ARTIFACTS: signing secrets are not configured for this non-release run." | Tee-Object -FilePath ci-artifacts/unsigned-artifacts.txt
            $env:CSC_IDENTITY_AUTO_DISCOVERY = "false"
          }
          npm run ci:package 2>&1 | Tee-Object -FilePath ci-artifacts/package.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify Windows signatures
        shell: pwsh
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          $version = (Get-Content -Raw package.json | ConvertFrom-Json).version
          $files = @(
            "apps/desktop/release/NEMESIS Setup $version.exe",
            "apps/desktop/release/win-unpacked/NEMESIS.exe",
            "apps/desktop/release/win-unpacked/resources/gea-app/Global Event Alpha.exe",
            "apps/global-event-alpha/release/win-unpacked/Global Event Alpha.exe"
          )
          $isRelease = "${{ startsWith(github.ref, 'refs/tags/') }}"
          if (-not $env:CSC_LINK -or -not $env:CSC_KEY_PASSWORD) {
            if ($isRelease -eq "true") {
              throw "Release/tag builds require signing secrets before signature verification."
            }
            "UNSIGNED CI ARTIFACTS: signing secrets are not configured for this non-release run." | Tee-Object -FilePath ci-artifacts/signatures.log
            exit 0
          }
          foreach ($file in $files) {
            $sig = Get-AuthenticodeSignature $file
            "$file`t$($sig.Status)`t$($sig.SignerCertificate.Subject)" | Tee-Object -FilePath ci-artifacts/signatures.log -Append
            if ($sig.Status -ne "Valid") { exit 1 }
          }

      - name: Upload CI evidence
        if: always()
        # The evidence bundle carries the packaged installers, so each run stores
        # ~675MB and the account artifact quota fills after a handful of runs.
        # Once full, CreateArtifact fails and reds the badge on a build whose
        # every real gate -- build, typecheck, unit, e2e, packaging, signature
        # verification -- passed. Evidence storage is diagnostic, not a gate, so
        # it must not decide whether the build is green; retention caps the
        # accumulation that causes the failure in the first place.
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: nemesis-ci-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 7
          path: |
            ci-artifacts/**
            apps/desktop/release/**
            apps/global-event-alpha/release/**
            apps/desktop/test-results/**
            apps/desktop/playwright-report/**
